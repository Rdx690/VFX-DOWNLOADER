<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050511"><title>VFX DOWNLOADER</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#151047,#070714 48%,#030308);color:#fff;font-family:system-ui,sans-serif;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:22px 17px}.logo{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px;border:2px solid #8b48ff;box-shadow:0 0 22px #8b35ff,0 0 35px #00bfff66;background:#080718;font-size:30px;font-weight:1000;text-shadow:0 0 12px #b42cff}.brand{text-align:center;font-size:27px;font-weight:950;text-shadow:0 0 12px #9e38ff}.brand span{color:#28dcff}.tag{text-align:center;color:#b9b5db;font-size:12px;letter-spacing:3px;margin:5px 0 24px}.panel{border:1px solid #5b37a8;background:#0c0b1d;border-radius:22px;padding:18px}.label{font-size:13px;color:#d3c9ff;font-weight:700;margin-bottom:9px;display:block}.linkrow{display:flex;gap:8px}input{min-width:0;flex:1;background:#050510;border:1px solid #40366b;border-radius:13px;padding:14px 12px;color:white;font-size:14px}.small,.fmt{border:1px solid #6e49d7;background:#17112e;color:white;border-radius:12px;padding:12px;font-weight:800}.formats{display:flex;gap:10px;margin-top:14px}.fmt{flex:1}.fmt.active{border-color:#21dcff;background:#10243a}.primary{width:100%;margin-top:13px;padding:15px;border:0;border-radius:14px;color:white;font-weight:950;background:linear-gradient(100deg,#9b24ff,#345dff,#00cfff)}.status{font-size:13px;color:#c5b9ef;line-height:1.5;margin-top:14px;overflow-wrap:anywhere}.item{border:1px solid #36305b;border-radius:14px;padding:13px;margin-top:10px;background:#100e20}.item p{font-size:12px;color:#aaa5c9;overflow-wrap:anywhere}.dl{width:100%;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#7f26ff,#00bde9);color:white;font-weight:900}.foot{text-align:center;color:#706a8f;font-size:11px;margin-top:22px;line-height:1.6}</style></head><body><main class="wrap"><div class="logo">👑 VFX</div><div class="brand">VFX <span>DOWNLOADER</span></div><div class="tag">POWERED BY SOURAJIT VFX</div><section class="panel"><label class="label" for="url">PASTE VIDEO / MUSIC LINK</label><div class="linkrow"><input id="url" placeholder="Paste Instagram, YouTube, etc. link"><button class="small" onclick="pasteLink()">PASTE</button></div><div class="formats"><button id="mp4" class="fmt active" onclick="choose('mp4')">▣ MP4 VIDEO</button><button id="mp3" class="fmt" onclick="choose('mp3')">♫ MP3 AUDIO</button></div><button class="primary" id="go" onclick="startDownload()">⚡ FETCH MEDIA</button><div id="status" class="status">Paste a link and tap Fetch Media. Download support depends on the API.</div></section><div id="results"></div><div class="foot">Download only content you own or have permission to save.<br>MP3 requires an audio URL from the API.</div></main><script>
let mode='mp4',media=[];function status(t){document.getElementById('status').textContent=t}function pasteLink(){try{let t=AndroidBridge.clipboardText();if(t)document.getElementById('url').value=t;else status('Copy a link first.')}catch(e){status('Paste your link into the box.')}}
function choose(m){mode=m;document.getElementById('mp4').classList.toggle('active',m==='mp4');document.getElementById('mp3').classList.toggle('active',m==='mp3');render()}
function startDownload(){let u=document.getElementById('url').value.trim();if(!/^https?:\/\/\S+/i.test(u)){status('Enter a valid http/https link.');return}media=[];document.getElementById('results').innerHTML='';status('Connecting to API…');document.getElementById('go').disabled=true;AndroidBridge.fetchInfo(u)}
window.onApiResult=function(s){document.getElementById('go').disabled=false;let r;try{r=JSON.parse(s)}catch(e){status('Invalid response');return}if(!r.ok){status('Error: '+r.error);return}let o;try{o=JSON.parse(r.data)}catch(e){o=r.data}media=extract(o);if(!media.length){status('No recognized direct media URL found. API response format may need updating.');document.getElementById('results').textContent=typeof o==='string'?o:JSON.stringify(o);return}status('Found '+media.length+' media link(s).');render()}
function extract(o){let a=[],seen=new Set();function walk(x){if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==='object')for(let [k,v] of Object.entries(x)){if(typeof v==='string'&&/^https?:\/\//i.test(v)&&/(url|link|download|video|audio|src|mp4|mp3|media|stream)/i.test(k)){let ext=(v.split('?')[0].match(/\.(mp3|m4a|aac|wav|ogg|mp4|mov|webm|m3u8)$/i)||[])[1]?.toLowerCase()||'';let type=/audio|mp3|m4a|aac|wav|ogg/i.test(k)||['mp3','m4a','aac','wav','ogg'].includes(ext)?'mp3':'mp4';if(!seen.has(v)){seen.add(v);a.push({url:v,label:k,type,ext})}}else if(v&&typeof v==='object')walk(v)}}walk(o);return a}
function render(){let el=document.getElementById('results');el.innerHTML='';let a=media.filter(x=>x.type===mode);if(media.length&&!a.length){el.textContent='No '+mode.toUpperCase()+' link detected. Try the other format.';return}a.forEach((x,i)=>{let d=document.createElement('div');d.className='item';let ext=mode==='mp3'?'mp3':(x.ext&&x.ext!=='m3u8'?x.ext:'mp4');d.innerHTML='<b>'+mode.toUpperCase()+' · '+esc(x.label)+'</b><p>'+esc(x.url.slice(0,120))+'</p><button class="dl">⬇ DOWNLOAD '+mode.toUpperCase()+'</button>';d.querySelector('button').onclick=()=>AndroidBridge.download(x.url,'VFX_Download_'+(i+1)+'.'+ext,mode==='mp3'?'audio/mpeg':'video/mp4');el.appendChild(d)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.addEventListener('load',()=>{try{let t=AndroidBridge.clipboardText();if(t)document.getElementById('url').value=t}catch(e){}})
</script></body></html>
